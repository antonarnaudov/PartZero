[package]
name = "forge-core"
description = "Forge kernel foundation: scalars, deterministic math, exact predicates, arenas, geometry and B-rep topology with provenance"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license = "MPL-2.0"
publish.workspace = true

[dependencies]
libm.workspace = true
smallvec.workspace = true
thiserror.workspace = true

[dev-dependencies]
num-bigint.workspace = true
num-rational.workspace = true
num-traits.workspace = true
# Only used to assert that `Tolerance::IR_DEFAULT` matches the IR's normative constant.
forge-ir.workspace = true

# proptest only on native targets, as in forge-solve: its default `fork`/`timeout` features
# pull in `wait-timeout`, which does not build for wasm32-wasip1. The determinism golden
# (`tests/determinism_golden.rs`, no proptest) must build and pass there (audit M4):
#   cargo test -p forge-core --target wasm32-wasip1 --test determinism_golden
# The proptest-based test files are native-only.
[target.'cfg(not(target_family = "wasm"))'.dev-dependencies]
proptest.workspace = true

[lints]
workspace = true
