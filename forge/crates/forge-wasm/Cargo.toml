[package]
name = "forge-wasm"
description = "WebAssembly bindings of Forge for the web: IR evaluation + tessellation, mesh export, and the forge-render viewport"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license = "MPL-2.0"
publish.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
forge-ir.workspace = true
forge-regen.workspace = true
forge-mesh.workspace = true
forge-io.workspace = true
forge-render = { path = "../forge-render" }
serde_json.workspace = true
# JS bindings (MIT OR Apache-2.0). Pinned exactly: the `wasm-bindgen` CLI used by
# packages/forge-web/scripts/build.mjs must be the same version.
wasm-bindgen = "=0.2.128"
js-sys = "0.3"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["HtmlCanvasElement", "OffscreenCanvas"] }
# Readable panic messages in the browser console (MIT OR Apache-2.0).
console_error_panic_hook = "0.1"

[lints]
workspace = true
