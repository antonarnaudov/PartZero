[project]
name = "aicad-oracle"
version = "0.0.1"
description = "OCCT (build123d/OCP) reference evaluator of the aicad IR v0 and v1, for differential testing of Forge. CI/dev tooling only - never shipped."
readme = "README.md"
license = "MPL-2.0"
requires-python = ">=3.13,<3.14"
dependencies = [
    "build123d==0.12.0",
    "cadquery-ocp-novtk==7.9.3.1.1",
    "jsonschema>=4.23,<5",
]

[project.scripts]
oracle = "aicad_oracle.cli:main"

[dependency-groups]
dev = ["pytest>=8.3"]

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aicad_oracle"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
