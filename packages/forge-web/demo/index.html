<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>forge-render demo</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <main id="stage"><canvas id="view" aria-label="3D viewport"></canvas></main>
    <aside id="panel">
      <header>
        <h1>forge-render</h1>
        <span id="backend" class="badge">…</span>
      </header>
      <section>
        <label>Document <select id="doc"></select></label>
        <div id="dim" hidden>
          <label>Base thickness <output id="dimOut">6.0</output> mm
            <input id="dimIn" type="range" min="2" max="14" step="0.1" value="6" />
          </label>
          <label>Edit path
            <select id="editPath">
              <option value="main">main thread (loadIr)</option>
              <option value="worker">worker (evaluate → setBodies)</option>
            </select>
          </label>
          <button id="bench" type="button">Run 20 edits</button>
        </div>
      </section>
      <section class="row">
        <button data-view="iso" type="button">Iso</button>
        <button data-view="top" type="button">Top</button>
        <button data-view="front" type="button">Front</button>
        <button data-view="right" type="button">Right</button>
        <button id="fit" type="button">Fit</button>
      </section>
      <section class="row">
        <label><input id="ortho" type="checkbox" /> Ortho</label>
        <label><input id="edges" type="checkbox" checked /> Edges</label>
        <label><input id="sil" type="checkbox" checked /> Silhouettes</label>
        <label><input id="grid" type="checkbox" checked /> Grid</label>
        <label><input id="spin" type="checkbox" /> Spin</label>
      </section>
      <section>
        <label><input id="section" type="checkbox" /> Section
          <select id="secAxis"><option>X</option><option>Y</option><option selected>Z</option></select>
          <button id="secFlip" type="button" title="Flip the removed side">⇅</button>
        </label>
        <input id="secPos" type="range" min="0" max="1" step="0.001" value="0.5" aria-label="Section position" />
      </section>
      <section>
        <label>Backend
          <select id="backendSel">
            <option value="auto">auto</option>
            <option value="webgpu">webgpu</option>
            <option value="webgl2">webgl2</option>
          </select>
        </label>
      </section>
      <dl id="stats"></dl>
      <pre id="pick">Hover or click the model.</pre>
    </aside>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
